<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>无忧物流-标准 区域定价工具</title>

<style>
  /* ============ 全局 ============ */
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI","Microsoft YaHei",sans-serif;
    background:#0a0612;
    color:#e8e3f5;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ============ 登录页 ============ */
  #fakeLogin{
    position:fixed;inset:0;z-index:99999;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    background:radial-gradient(ellipse at 30% 20%, #2a1650 0%, transparent 55%),
               radial-gradient(ellipse at 75% 75%, #3d1a6e 0%, transparent 55%),
               radial-gradient(ellipse at 50% 50%, #1a0b3a 0%, #0a0612 100%);
  }

  /* 动态光斑 */
  .orb{
    position:absolute;border-radius:50%;
    filter:blur(80px);opacity:.55;
    pointer-events:none;
    animation:orbFloat 18s ease-in-out infinite;
  }
  .orb.o1{width:500px;height:500px;background:#7c3aed;top:-100px;left:-100px;}
  .orb.o2{width:400px;height:400px;background:#c026d3;top:50%;right:-100px;animation-delay:-6s;}
  .orb.o3{width:350px;height:350px;background:#8b5cf6;bottom:-100px;left:30%;animation-delay:-12s;}

  @keyframes orbFloat{
    0%,100%{transform:translate(0,0) scale(1);}
    33%{transform:translate(60px,-40px) scale(1.1);}
    66%{transform:translate(-40px,50px) scale(.95);}
  }

  /* 鼠标跟随光斑 */
  .cursor-glow{
    position:fixed;width:600px;height:600px;
    border-radius:50%;pointer-events:none;
    background:radial-gradient(circle, rgba(168,85,247,.25) 0%, transparent 65%);
    transform:translate(-50%,-50%);
    transition:transform .15s ease-out;
    z-index:1;
    mix-blend-mode:screen;
  }

  /* 网格 */
  .login-grid{
    position:absolute;inset:0;
    background-image:
      linear-gradient(rgba(168,85,247,.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(168,85,247,.06) 1px, transparent 1px);
    background-size:50px 50px;
    mask-image:radial-gradient(ellipse at center, #000 30%, transparent 75%);
    -webkit-mask-image:radial-gradient(ellipse at center, #000 30%, transparent 75%);
    animation:gridDrift 30s linear infinite;
    pointer-events:none;
  }
  @keyframes gridDrift{
    0%{background-position:0 0;}
    100%{background-position:50px 50px;}
  }

  /* 浮动图标 */
  .float-icon{
    position:absolute;font-size:60px;
    opacity:.08;pointer-events:none;
    animation:floatIcon 10s ease-in-out infinite;
    filter:drop-shadow(0 0 20px rgba(168,85,247,.5));
  }
  @keyframes floatIcon{
    0%,100%{transform:translateY(0) rotate(0);}
    50%{transform:translateY(-30px) rotate(8deg);}
  }

  /* 粒子 */
  .particles{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
  .particle{
    position:absolute;border-radius:50%;
    animation:floatUp linear infinite;
  }
  @keyframes floatUp{
    0%{transform:translateY(100vh) scale(0);opacity:0;}
    10%,90%{opacity:.9;}
    100%{transform:translateY(-100px) scale(1.3);opacity:0;}
  }

  /* ============ 登录卡片 ============ */
  .login-card{
    position:relative;z-index:10;
    width:400px;padding:46px 40px;
    background:rgba(30,15,60,.45);
    backdrop-filter:blur(40px) saturate(180%);
    -webkit-backdrop-filter:blur(40px) saturate(180%);
    border-radius:28px;
    border:1px solid rgba(168,85,247,.25);
    box-shadow:
      0 30px 90px rgba(124,58,237,.4),
      inset 0 1px 0 rgba(255,255,255,.15),
      inset 0 -1px 0 rgba(168,85,247,.15);
    animation:cardIn .9s cubic-bezier(.2,.8,.2,1);
    overflow:hidden;
  }
  .login-card::before{
    content:'';position:absolute;
    top:-50%;left:-50%;width:200%;height:200%;
    background:conic-gradient(from 0deg,
      transparent 0deg, rgba(168,85,247,.12) 90deg,
      transparent 180deg, rgba(217,70,239,.12) 270deg,
      transparent 360deg);
    animation:cardShine 12s linear infinite;
    pointer-events:none;
  }
  @keyframes cardShine{
    0%{transform:rotate(0deg);}
    100%{transform:rotate(360deg);}
  }
  @keyframes cardIn{
    0%{opacity:0;transform:translateY(40px) scale(.95);}
    100%{opacity:1;transform:translateY(0) scale(1);}
  }
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-10px);}
    40%{transform:translateX(10px);}
    60%{transform:translateX(-6px);}
    80%{transform:translateX(6px);}
  }

  .login-card .inner{position:relative;z-index:2;}

  /* Logo */
  .logo-area{text-align:center;margin-bottom:36px;}
  .logo-circle{
    display:inline-flex;align-items:center;justify-content:center;
    width:72px;height:72px;border-radius:22px;
    background:linear-gradient(135deg,#8b5cf6,#d946ef);
    box-shadow:
      0 12px 40px rgba(168,85,247,.6),
      inset 0 1px 0 rgba(255,255,255,.3);
    margin-bottom:20px;
    position:relative;
    animation:logoPulse 3s ease-in-out infinite;
  }
  .logo-circle::after{
    content:'';position:absolute;inset:-6px;border-radius:26px;
    background:linear-gradient(135deg,#8b5cf6,#d946ef,#8b5cf6);
    background-size:300% 300%;
    animation:logoRing 4s linear infinite;
    z-index:-1;opacity:.5;filter:blur(8px);
  }
  @keyframes logoRing{
    0%{background-position:0% 50%;}
    100%{background-position:300% 50%;}
  }
  @keyframes logoPulse{
    0%,100%{box-shadow:0 12px 40px rgba(168,85,247,.6),inset 0 1px 0 rgba(255,255,255,.3);}
    50%{box-shadow:0 12px 60px rgba(217,70,239,.9),inset 0 1px 0 rgba(255,255,255,.3);}
  }
  .logo-circle svg{width:36px;height:36px;fill:#fff;}

  .logo-title{
    font-size:26px;font-weight:800;letter-spacing:1px;margin-bottom:8px;
    background:linear-gradient(90deg,#c4b5fd,#e9d5ff,#f0abfc);
    background-size:200% 100%;
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:titleFlow 4s linear infinite;
  }
  @keyframes titleFlow{
    0%{background-position:0% 50%;}
    100%{background-position:200% 50%;}
  }
  .logo-sub{
    font-size:11px;color:rgba(196,181,253,.5);
    letter-spacing:3px;text-transform:uppercase;
  }

  /* 输入框 */
  .input-group{margin-bottom:18px;position:relative;}
  .input-group label{
    display:block;font-size:12px;
    color:rgba(196,181,253,.7);
    margin-bottom:8px;font-weight:500;letter-spacing:.5px;
  }
  .input-group input{
    width:100%;padding:14px 18px;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(168,85,247,.2);
    border-radius:14px;
    font-size:14px;color:#fff;outline:none;
    transition:all .3s;
    backdrop-filter:blur(10px);
  }
  .input-group input::placeholder{color:rgba(196,181,253,.3);}
  .input-group input:focus{
    background:rgba(168,85,247,.08);
    border-color:rgba(217,70,239,.6);
    box-shadow:
      0 0 0 4px rgba(168,85,247,.15),
      0 0 30px rgba(168,85,247,.4);
  }

  /* 按钮 */
  .login-btn{
    width:100%;padding:15px;margin-top:10px;
    background:linear-gradient(135deg,#8b5cf6,#d946ef,#8b5cf6);
    background-size:200% 200%;
    color:#fff;border:none;border-radius:14px;
    font-size:15px;font-weight:700;letter-spacing:3px;
    cursor:pointer;position:relative;overflow:hidden;
    box-shadow:0 12px 40px rgba(168,85,247,.5);
    transition:all .3s;
    animation:btnFlow 5s linear infinite;
    backdrop-filter:blur(10px);
  }
  @keyframes btnFlow{
    0%{background-position:0% 50%;}
    100%{background-position:200% 50%;}
  }
  .login-btn::before{
    content:'';position:absolute;top:0;left:-100%;
    width:100%;height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);
    transition:left .7s;
  }
  .login-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 18px 50px rgba(217,70,239,.7);
  }
  .login-btn:hover::before{left:100%;}

  .error-msg{
    display:none;margin-top:12px;padding:10px 14px;
    background:rgba(239,68,68,.12);
    border:1px solid rgba(239,68,68,.35);
    border-radius:12px;
    color:#fca5a5;font-size:12px;text-align:center;
  }

  .footer-note{
    text-align:center;font-size:11px;
    color:rgba(196,181,253,.3);
    margin-top:24px;letter-spacing:1px;
  }

  /* ============ 工具页 ============ */
  #mainTool{
    position:relative;z-index:5;
    min-height:100vh;
    padding:20px 24px 40px;
    background:
      radial-gradient(ellipse at 15% 10%, rgba(124,58,237,.15) 0%, transparent 50%),
      radial-gradient(ellipse at 85% 90%, rgba(217,70,239,.12) 0%, transparent 50%),
      #0a0612;
  }

  /* 工具页背景动态光斑 */
  #mainTool .orb{opacity:.35;filter:blur(100px);}
  #mainTool .orb.m1{width:600px;height:600px;background:#7c3aed;top:-200px;left:-200px;}
  #mainTool .orb.m2{width:500px;height:500px;background:#d946ef;bottom:-150px;right:-150px;animation-delay:-9s;}

  /* 顶部仪表盘 */
  .dash-header{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:20px;flex-wrap:wrap;gap:16px;
  }
  .dash-title{
    font-size:22px;font-weight:800;
    background:linear-gradient(90deg,#c4b5fd,#f0abfc);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
    display:flex;align-items:center;gap:10px;
  }
  .dash-title::before{
    content:'';width:8px;height:8px;border-radius:50%;
    background:#a855f7;box-shadow:0 0 12px #a855f7;
    animation:dotPulse 2s ease-in-out infinite;
  }
  @keyframes dotPulse{
    0%,100%{opacity:1;transform:scale(1);}
    50%{opacity:.5;transform:scale(1.4);}
  }
  .dash-time{
    font-size:12px;color:rgba(196,181,253,.5);
    font-family:monospace;
    padding:6px 12px;
    background:rgba(168,85,247,.08);
    border:1px solid rgba(168,85,247,.2);
    border-radius:10px;
  }

  /* 统计卡片 */
  .stats-row{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:14px;margin-bottom:20px;
  }
  .stat-card{
    background:rgba(30,15,60,.4);
    backdrop-filter:blur(24px) saturate(180%);
    -webkit-backdrop-filter:blur(24px) saturate(180%);
    border:1px solid rgba(168,85,247,.2);
    border-radius:18px;
    padding:18px 20px;
    position:relative;overflow:hidden;
    transition:all .3s;
  }
  .stat-card::before{
    content:'';position:absolute;top:0;left:0;
    width:100%;height:2px;
    background:linear-gradient(90deg,transparent,#a855f7,transparent);
    opacity:.6;
  }
  .stat-card:hover{
    transform:translateY(-3px);
    border-color:rgba(217,70,239,.4);
    box-shadow:0 12px 40px rgba(168,85,247,.25);
  }
  .stat-label{
    font-size:11px;color:rgba(196,181,253,.6);
    letter-spacing:1px;text-transform:uppercase;
    margin-bottom:8px;
  }
  .stat-value{
    font-size:24px;font-weight:800;
    background:linear-gradient(90deg,#e9d5ff,#f0abfc);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .stat-sub{
    font-size:11px;color:rgba(196,181,253,.4);
    margin-top:6px;
  }

  /* 参数栏 */
  .topbar{
    display:flex;flex-wrap:wrap;align-items:center;gap:10px;
    background:rgba(30,15,60,.4);
    backdrop-filter:blur(24px) saturate(180%);
    -webkit-backdrop-filter:blur(24px) saturate(180%);
    border:1px solid rgba(168,85,247,.2);
    border-radius:18px;
    padding:14px 18px;
    margin-bottom:14px;
  }
  .topbar label{
    font-size:12px;color:rgba(196,181,253,.7);
    font-weight:500;white-space:nowrap;
  }
  .topbar input,.topbar select{
    padding:7px 10px;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(168,85,247,.2);
    border-radius:10px;
    font-size:12px;color:#fff;outline:none;
    transition:all .25s;
    width:74px;
  }
  .topbar input.wide{width:94px;}
  .topbar input:focus,.topbar select:focus{
    border-color:rgba(217,70,239,.6);
    box-shadow:0 0 0 3px rgba(168,85,247,.15);
  }
  .topbar select option{background:#1a0b3a;color:#fff;}

  /* SKU 栏 */
  .skubar{
    display:flex;flex-wrap:wrap;align-items:center;gap:10px;
    background:rgba(30,15,60,.4);
    backdrop-filter:blur(24px) saturate(180%);
    -webkit-backdrop-filter:blur(24px) saturate(180%);
    border:1px solid rgba(168,85,247,.2);
    border-radius:18px;
    padding:14px 18px;
    margin-bottom:14px;
  }
  .skubar label{
    font-size:12px;color:rgba(196,181,253,.7);
    font-weight:500;white-space:nowrap;
  }
  .skubar input{
    padding:8px 12px;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(168,85,247,.2);
    border-radius:10px;
    font-size:13px;color:#fff;outline:none;
    transition:all .25s;
    width:140px;
  }
  .skubar input:focus{
    border-color:rgba(217,70,239,.6);
    box-shadow:0 0 0 3px rgba(168,85,247,.15);
  }

  /* 按钮 */
  button{
    border:none;border-radius:12px;
    padding:8px 18px;font-size:13px;cursor:pointer;
    font-weight:600;transition:all .25s;
    white-space:nowrap;
  }
  button.primary{
    background:linear-gradient(135deg,#8b5cf6,#d946ef);
    color:#fff;
    box-shadow:0 8px 24px rgba(168,85,247,.5);
    padding:10px 24px;
    font-size:13px;
  }
  button.primary:hover{
    transform:translateY(-2px);
    box-shadow:0 14px 36px rgba(217,70,239,.7);
  }
  button.secondary{
    background:rgba(168,85,247,.12);
    color:#c4b5fd;
    border:1px solid rgba(168,85,247,.3);
    padding:10px 24px;
    font-size:13px;
  }
  button.secondary:hover{
    background:rgba(168,85,247,.2);
    border-color:rgba(217,70,239,.5);
    transform:translateY(-2px);
  }
  button.copy{
    background:linear-gradient(135deg,#10b981,#059669);
    color:#fff;
    padding:5px 14px;font-size:11px;
    box-shadow:0 4px 12px rgba(16,185,129,.4);
  }
  button.copy:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(16,185,129,.6);
  }

  /* 汇总 */
  .summary{
    display:flex;gap:24px;flex-wrap:wrap;
    font-size:13px;margin-bottom:14px;
    padding:14px 20px;
    background:rgba(30,15,60,.4);
    backdrop-filter:blur(24px) saturate(180%);
    -webkit-backdrop-filter:blur(24px) saturate(180%);
    border:1px solid rgba(168,85,247,.2);
    border-radius:18px;
  }
  .summary span{
    color:#f0abfc;font-weight:700;
    background:linear-gradient(90deg,#e9d5ff,#f0abfc);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
  }

  /* 结果 */
  #results{position:relative;z-index:2;}
  .row-label{
    font-size:12px;color:rgba(196,181,253,.6);
    margin:10px 0 6px;font-weight:600;
    letter-spacing:.5px;
  }
  .sku-title{
    display:flex;align-items:center;gap:12px;
    font-size:14px;font-weight:700;
    background:linear-gradient(90deg,#e9d5ff,#f0abfc);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
    margin:14px 0 8px;flex-wrap:wrap;
  }
  .sku-title button{
    -webkit-text-fill-color:#fff;
  }

  .table-wrap{
    overflow-x:auto;overflow-y:visible;
    border-radius:14px;
    border:1px solid rgba(168,85,247,.2);
    margin-bottom:12px;
    background:rgba(20,10,45,.5);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
  }
  table{
    border-collapse:collapse;font-size:12px;
    table-layout:fixed;min-width:100%;
  }
  th,td{
    border:1px solid rgba(168,85,247,.12);
    padding:6px 9px;text-align:right;
    white-space:nowrap;
  }
  th:first-child,td:first-child{
    text-align:left;
    background:rgba(168,85,247,.12);
    color:#e9d5ff;font-weight:700;
    position:sticky;left:0;z-index:2;
    width:74px;min-width:74px;
    font-size:11px;
    backdrop-filter:blur(10px);
  }
  th:not(:first-child),td:not(:first-child){
    width:62px;min-width:62px;
  }
  th{
    background:rgba(168,85,247,.1);
    text-align:center;color:#e9d5ff;font-weight:700;
    border-bottom:2px solid rgba(168,85,247,.3);
    font-size:11px;
    position:sticky;top:0;
  }
  tbody tr:nth-child(even){background:rgba(168,85,247,.03);}
  tbody tr:hover{background:rgba(168,85,247,.08);}
  td{color:#d8cff0;}

  /* Toast */
  .toast{
    position:fixed;top:24px;left:50%;transform:translateX(-50%);
    background:linear-gradient(135deg,#8b5cf6,#d946ef);
    color:#fff;padding:12px 24px;border-radius:14px;
    font-size:13px;font-weight:600;
    z-index:999999;opacity:0;
    transition:opacity .3s, transform .3s;
    pointer-events:none;
    box-shadow:0 12px 40px rgba(168,85,247,.6);
    backdrop-filter:blur(10px);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(4px);}
</style>
</head>
<body>

<!-- ============ 登录页 ============ -->
<div id="fakeLogin">
  <div class="orb o1"></div>
  <div class="orb o2"></div>
  <div class="orb o3"></div>
  <div class="login-grid"></div>
  <div class="cursor-glow" id="cursorGlow"></div>
  <div class="particles" id="particles"></div>

  <div class="float-icon" style="top:12%;left:8%;animation-duration:9s;">📦</div>
  <div class="float-icon" style="top:72%;left:86%;animation-duration:11s;">✈️</div>
  <div class="float-icon" style="top:78%;left:14%;animation-duration:10s;">🚚</div>
  <div class="float-icon" style="top:18%;left:82%;animation-duration:12s;">🌐</div>
  <div class="float-icon" style="top:45%;left:5%;animation-duration:13s;">⚡</div>
  <div class="float-icon" style="top:55%;left:93%;animation-duration:8s;">🚀</div>

  <div class="login-card" id="loginCard">
    <div class="inner">
      <div class="logo-area">
        <div class="logo-circle">
          <svg viewBox="0 0 24 24"><path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4zM6 18.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm13.5-9l1.96 2.5H17V9.5h2.5zm-1.5 9c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
        </div>
        <div class="logo-title">无忧物流-标准</div>
        <div class="logo-sub">Regional Pricing Tool</div>
      </div>

      <div class="input-group">
        <label>账号</label>
        <input id="fakeUser" type="text" placeholder="请输入账号" autocomplete="off">
      </div>

      <div class="input-group">
        <label>密码</label>
        <input id="fakePass" type="password" placeholder="请输入密码">
      </div>

      <button class="login-btn" id="fakeLoginBtn">登 录</button>

      <div class="error-msg" id="loginError"></div>

      <div class="footer-note">仅供内部使用 · 请勿外传</div>
    </div>
  </div>
</div>

<script>
// 生成彩色粒子
(function(){
  var container = document.getElementById('particles');
  var colors = ['#a855f7', '#d946ef', '#8b5cf6', '#c4b5fd', '#e9d5ff', '#f0abfc'];
  for(var i = 0; i < 55; i++){
    var p = document.createElement('div');
    p.className = 'particle';
    var color = colors[Math.floor(Math.random() * colors.length)];
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDuration = (7 + Math.random() * 12) + 's';
    p.style.animationDelay = (Math.random() * 12) + 's';
    var size = 2 + Math.random() * 5;
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    p.style.background = color;
    p.style.boxShadow = '0 0 ' + (size * 4) + 'px ' + color;

// 登录校验
function doLogin(){
  var user = document.getElementById('fakeUser').value.trim();
  var pass = document.getElementById('fakePass').value.trim();
  var err = document.getElementById('loginError');
  var card = document.getElementById('loginCard');

  if(!user || !pass){
    err.style.display = 'block';
    if(!user && !pass){err.textContent = '请输入账号和密码';}
    else if(!user){err.textContent = '请输入账号';}
    else{err.textContent = '请输入密码';}
    card.style.animation = 'none';
    void card.offsetWidth;
    card.style.animation = 'shake .4s';
    return;
  }

  err.style.display = 'none';
  var login = document.getElementById('fakeLogin');
  var main = document.getElementById('mainTool');

  login.style.transition = 'opacity .6s, transform .6s';
  login.style.opacity = '0';
  login.style.transform = 'scale(1.06)';

  setTimeout(function(){
    login.style.display = 'none';
    main.style.display = 'block';
    main.style.opacity = '0';
    main.style.transform = 'translateY(30px) scale(.98)';
    main.style.transition = 'opacity .8s cubic-bezier(.2,.8,.2,1), transform .8s cubic-bezier(.2,.8,.2,1)';
    void main.offsetWidth;
    main.style.opacity = '1';
    main.style.transform = 'translateY(0) scale(1)';
  }, 600);
}

document.getElementById('fakeLoginBtn').addEventListener('click', doLogin);
document.getElementById('fakePass').addEventListener('keydown', function(e){if(e.key==='Enter')doLogin();});
document.getElementById('fakeUser').addEventListener('keydown', function(e){if(e.key==='Enter')doLogin();});
</script>

var lastResults = [];

function showToast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');}, 1500);
}

function getGlobalInputs(){
  return {
    cost: parseFloat(document.getElementById('cost').value)||0,
    weight: (parseFloat(document.getElementById('weight').value)||0)/1000,
    length: parseFloat(document.getElementById('length').value)||0,
    width: parseFloat(document.getElementById('width').value)||0,
    height: parseFloat(document.getElementById('height').value)||0,
    rate: parseFloat(document.getElementById('rate').value)||6.7,
    commission: (parseFloat(document.getElementById('commission').value)||0)/100,
    profit: (parseFloat(document.getElementById('profit').value)||0)/100,
    taxRate: (parseFloat(document.getElementById('taxRate').value)||0)/100,
    goodsType: document.getElementById('goodsType').value,
    divisor: parseFloat(document.getElementById('divisor').value)||8000,
    useVolumetric: document.getElementById('useVolumetric').checked
  };
}

function getSkuCode(){
  return document.getElementById('skuCode').value || 'SKU-1';
}

function calcBillingWeight(g){
  var actual = g.weight;
  if(!g.useVolumetric) return actual;
  var L = Math.round(g.length);
  var W = Math.round(g.width);
  var H = Math.round(g.height);
  var vol = (L*W*H)/g.divisor;
  return Math.max(actual, vol);
}

function calcLogistics(country, billingKg, goodsType){
  var g = billingKg*1000;
  if(billingKg >= 2) return {fee:null, type:'超2kg'};
  var segs = goodsType==='pu' ? country.pu : country.fei;
  if(!segs || !segs.length) return {fee:null, type:'非普货暂无'};
  var seg = segs[segs.length-1];
  for(var i=0;i<segs.length;i++){
    if(g<=segs[i].maxG){seg=segs[i];break;}
  }
  return {fee: seg.p*billingKg + seg.r, type:'小包'};
}

function calcSalePrice(cost, fee, commission, profit, rate){
  if(fee===null) return null;
  var denom = 1 - commission - profit;
  if(denom<=0) return null;
  return (cost+fee)/denom/rate;
}

function calculateAll(){
  var g = getGlobalInputs();
  var skuCode = getSkuCode();
  var resultsDiv = document.getElementById('results');
  resultsDiv.innerHTML = '';
  lastResults = [];

  var billingKg = calcBillingWeight(g);
  var rows = [];
  var prices = [];

  RATES.forEach(function(c){
    var log = calcLogistics(c, billingKg, g.goodsType);
    var saleUsd = calcSalePrice(g.cost, log.fee, g.commission, g.profit, g.rate);
    var taxUsd = saleUsd===null ? null : saleUsd*(1+g.taxRate);
    var profitUsd = saleUsd===null ? null : saleUsd - g.cost/g.rate - (log.fee||0)/g.rate - saleUsd*g.commission;
    var row = {
      sku: skuCode, name: c.name, code: c.code,
      billingKg: billingKg.toFixed(3),
      fee: log.fee===null?'暂无':log.fee.toFixed(2),
      saleUsd: saleUsd===null?'暂无':saleUsd.toFixed(2),
      taxUsd: taxUsd===null?'暂无':taxUsd.toFixed(2),
      profitUsd: profitUsd===null?'暂无':profitUsd.toFixed(2),
      type: log.type
    };
    rows.push(row);
    if(saleUsd!==null) prices.push(saleUsd);
  });

  var avg = prices.length ? prices.reduce(function(a,b){return a+b;},0)/prices.length : 0;
  var profitRates = [];
  rows.forEach(function(r){
    if(r.saleUsd!=='暂无'){
      var s = parseFloat(r.saleUsd);
      var p = parseFloat(r.profitUsd);
      if(s>0) profitRates.push(p/s);
    }
  });
  var avgProfitRate = profitRates.length ? profitRates.reduce(function(a,b){return a+b;},0)/profitRates.length : 0;

  rows.forEach(function(r){
    if(r.saleUsd!=='暂无'){
      var s = parseFloat(r.saleUsd);
      r.adjust = ((s/avg-1)*100).toFixed(2)+'%';
      r.diff = (s-avg).toFixed(2);
    }else{
      r.adjust = '暂无';
      r.diff = '暂无';
    }
    lastResults.push(r);
  });

  document.getElementById('countryCount').textContent = prices.length;
  document.getElementById('avgPrice').textContent = avg.toFixed(2);
  document.getElementById('avgProfitRate').textContent = (avgProfitRate*100).toFixed(2);

  var title = document.createElement('div');
  title.className = 'sku-title';
  title.innerHTML = 'SKU：' + skuCode
    + ' <button class="copy" onclick="copySkuPrices(\''+skuCode+'\')">复制售价</button>';
  resultsDiv.appendChild(title);

  var half = Math.ceil(rows.length / 2);
  renderTransposedTable(rows.slice(0, half), resultsDiv, '第一行（'+half+' 国）');
  renderTransposedTable(rows.slice(half), resultsDiv, '第二行（'+(rows.length-half)+' 国）');
}

function renderTransposedTable(rows, container, label){
  if(!rows.length) return;
  var labelDiv = document.createElement('div');
  labelDiv.className = 'row-label';
  labelDiv.textContent = label;
  container.appendChild(labelDiv);

  var wrap = document.createElement('div');
  wrap.className = 'table-wrap';
  var table = document.createElement('table');

  var thead = '<thead><tr><th>项目</th>';
  rows.forEach(function(r){ thead += '<th>'+r.name+'</th>'; });
  thead += '</tr></thead>';

  var tbody = '<tbody>';
  tbody += '<tr><td>运费</td>' + rows.map(function(r){return '<td>'+r.fee+'</td>';}).join('') + '</tr>';
  tbody += '<tr><td>销售价</td>' + rows.map(function(r){return '<td>'+r.saleUsd+'</td>';}).join('') + '</tr>';
  tbody += '<tr><td>利润</td>' + rows.map(function(r){return '<td>'+r.profitUsd+'</td>';}).join('') + '</tr>';
  tbody += '<tr><td>调整</td>' + rows.map(function(r){return '<td>'+r.adjust+'</td>';}).join('') + '</tr>';
  tbody += '<tr><td>差价</td>' + rows.map(function(r){return '<td>'+r.diff+'</td>';}).join('') + '</tr>';
  tbody += '</tbody>';

  table.innerHTML = thead + tbody;
  wrap.appendChild(table);
  container.appendChild(wrap);
}

function copySkuPrices(skuCode){
  var rows = lastResults.filter(function(r){return r.sku===skuCode;});
  if(!rows.length){showToast('无数据');return;}
  var lines = ['国家\t销售价(USD)'];
  rows.forEach(function(r){
    lines.push(r.name + '\t' + r.saleUsd);
  });
  var text = lines.join('\n');
  copyText(text, '已复制 ' + rows.length + ' 个国家的售价');
}

function copyText(text, msg){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){
      showToast(msg || '已复制');
    }).catch(function(){
      fallbackCopy(text, msg);
    });
  }else{
    fallbackCopy(text, msg);
  }
}

function fallbackCopy(text, msg){
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try{
    document.execCommand('copy');
    showToast(msg || '已复制');
  }catch(e){
    showToast('复制失败，请手动复制');
  }
  document.body.removeChild(ta);
}

function exportCSV(){
  if(!lastResults.length){alert('请先点击“批量计算”');return;}
  var header = ['SKU','国家','Code','计费重量(kg)','运费(CNY)','销售价(USD)','含税价(USD)','利润(USD)','调整比例','差价(USD)','类型'];
  var lines = [header.join(',')];
  lastResults.forEach(function(r){
    lines.push([r.sku,r.name,r.code,r.billingKg,r.fee,r.saleUsd,r.taxUsd,r.profitUsd,r.adjust,r.diff,r.type].join(','));
  });
  var csv = '\ufeff'+lines.join('\n');
  var blob = new Blob([csv],{type:'text/csv;charset=utf-8;'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'SKU区域定价.csv'; a.click();
  URL.revokeObjectURL(url);
}

window.addEventListener('load', function(){
  calculateAll();
});
