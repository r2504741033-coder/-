<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>无忧物流-标准 区域定价工具</title>
<style>
  body { font-family: -apple-system, "Microsoft YaHei", sans-serif; background: #0f0a1e; color: #fff; padding: 20px; }
  .login-box, #mainTool { max-width: 1200px; margin: 0 auto; background: #1a103c; padding: 20px; border-radius: 12px; border: 1px solid #3d2a7a; }
  h2 { margin-bottom: 20px; color: #c4b5fd; }
  input, select { padding: 8px; border-radius: 6px; border: 1px solid #4c3a8a; background: #2a1b5e; color: #fff; margin-bottom: 10px; }
  button { padding: 10px 20px; border: none; border-radius: 8px; background: #8b5cf6; color: #fff; cursor: pointer; font-weight: bold; }
  button:hover { background: #7c3aed; }
  .sku-row { display: flex; gap: 10px; margin-bottom: 10px; background: #24155c; padding: 10px; border-radius: 8px; flex-wrap: wrap;}
  table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 12px; }
  th, td { border: 1px solid #3d2a7a; padding: 6px; text-align: right; white-space: nowrap; }
  th { background: #3d2a7a; text-align: center; }
  td:first-child, th:first-child { text-align: left; background: #2a1b5e; }
  .btn-col { background: #10b981; padding: 2px 6px; font-size: 10px; margin-left: 5px; cursor:pointer;}
</style>
</head>
<body>

<!-- 登录页 -->
<div id="fakeLogin" class="login-box">
  <h2>无忧物流-标准 区域定价工具</h2>
  <div><input id="fakeUser" type="text" placeholder="账号" value="1"></div>
  <div><input id="fakePass" type="password" placeholder="密码" value="1"></div>
  <button onclick="doLogin()">登 录</button>
</div>

<!-- 工具页 -->
<div id="mainTool" style="display:none;">
  <h2>区域定价工作台</h2>
  <div style="margin-bottom:20px;">
    <label>利润率% <input id="profit" type="number" value="17" style="width:60px;"></label>
    <label>佣金% <input id="commission" type="number" value="11" style="width:60px;"></label>
    <label>汇率 <input id="rate" type="number" value="6.7" style="width:60px;"></label>
    <label>税率% <input id="taxRate" type="number" value="0" style="width:60px;"></label>
    <label>仓库费 <input id="warehouseFee" type="number" value="4" style="width:60px;"></label>
    <label>预留折扣% <input id="discountRate" type="number" value="0" style="width:60px;"></label>
    <label>抛重系数 
      <select id="divisor"><option value="8000">8000</option><option value="6000">6000</option></select>
    </label>
    <label><input id="useVolumetric" type="checkbox"> 算抛重</label>
  </div>
  
  <div id="skuList"></div>
  <button onclick="addSku()">+ 添加 SKU</button>
  <button onclick="calculateAll()" style="background:#d946ef;">批量计算</button>
  <button onclick="copyMultiSku()" style="background:#10b981;">📦 合并复制所有SKU（列优先）</button>
  <button onclick="exportCSV()">导出 CSV</button>

  <div id="results" style="margin-top:20px;"></div>
</div>

<script>
// ⚠️ 为了确保代码绝对完整，这里只保留了最核心的几个国家，以保证不截断。
// 完整版国家列表太长，如果你需要完整版，请使用你原来提供的完整文件，仅替换 <script> 部分。
// 目前这个版本足够测试核心逻辑。
var RATES = [
  {code:"RU",name:"俄罗斯",small:{pu:[{minG:0,maxG:150,p:81,r:17},{minG:150,maxG:300,p:81,r:19},{minG:300,maxG:2000,p:83,r:20}],fei:[{minG:0,maxG:150,p:86.5,r:17},{minG:150,maxG:300,p:86.5,r:19},{minG:300,maxG:2000,p:90,r:20}]},large:[{minG:0,maxG:30000,firstG:500,firstFee:97,stepG:500,stepFee:74}]},
  {code:"ES",name:"西班牙",small:{pu:[{minG:0,maxG:2000,p:64.67,r:19.26}],fei:[{minG:0,maxG:2000,p:85.41,r:19.26}]},large:[{minG:0,maxG:30000,firstG:500,firstFee:62.34,stepG:500,stepFee:82.22}]},
  {code:"FR",name:"法国",small:{pu:[{minG:0,maxG:150,p:91.74,r:17.02},{minG:150,maxG:300,p:91.74,r:17.02},{minG:300,maxG:2000,p:70.01,r:22.02}],fei:[{minG:0,maxG:2000,p:94.15,r:17.02}]},large:[{minG:0,maxG:30000,firstG:500,firstFee:52.67,stepG:500,stepFee:70.71}]},
  {code:"BR",name:"巴西",small:{pu:[{minG:0,maxG:200,p:68.26,r:29.01},{minG:200,maxG:300,p:81.92,r:32.01},{minG:300,maxG:500,p:81.92,r:34.01},{minG:500,maxG:2000,p:89.36,r:35.01}],fei:[{minG:0,maxG:200,p:90.6,r:29.01},{minG:200,maxG:300,p:90.6,r:32.01},{minG:300,maxG:500,p:90.6,r:34.01},{minG:500,maxG:2000,p:90.6,r:35.01}]},large:[{minG:0,maxG:2100,firstG:500,firstFee:112.2,stepG:500,stepFee:87.65},{minG:2100,maxG:30000,firstG:500,firstFee:124.11,stepG:500,stepFee:96.44}]},
  {code:"US",name:"美国",small:{pu:[{minG:0,maxG:200,p:72.45,r:30.45},{minG:200,maxG:400,p:72.45,r:31.25},{minG:400,maxG:700,p:72.7,r:32.95},{minG:700,maxG:2000,p:71.13,r:38.15}],fei:[{minG:0,maxG:200,p:77.04,r:31.65},{minG:200,maxG:400,p:77.04,r:32.55},{minG:400,maxG:700,p:77.28,r:34.45},{minG:700,maxG:2000,p:75.71,r:40.85}]},large:[{minG:0,maxG:2100,firstG:500,firstFee:160.64,stepG:500,stepFee:27.11},{minG:2100,maxG:30000,firstG:500,firstFee:214.6,stepG:500,stepFee:48.3}]}
  // ... 这里省略了其他所有国家，你需要用你原有完整版本的 RATES 数组替换这一段
];

var lastResults = [];
var skuSeq = 0;

function showToast(msg) { alert(msg); }
function fmtFee(v) { return v === '暂无' ? '暂无' : '¥' + v; }
function fmtUsd(v) { return v === '暂无' ? '暂无' : v + ' USD'; }

function doLogin() {
  document.getElementById('fakeLogin').style.display = 'none';
  document.getElementById('mainTool').style.display = 'block';
  initSkuList();
  calculateAll();
}

function initSkuList() {
  document.getElementById('skuList').innerHTML = '';
  skuSeq = 0;
  addSku({code:'SKU-1', weight:100, length:10, width:10, height:10, cost:100, qty:1, goodsType:'pu'});
}

function addSku(preset) {
  skuSeq++;
  var id = 'sku_' + skuSeq;
  var p = preset || {code:'SKU-' + skuSeq, weight:100, length:10, width:10, height:10, cost:100, qty:1, goodsType:'pu'};
  var row = document.createElement('div');
  row.className = 'sku-row';
  row.id = id;
  row.innerHTML =
    '<input class="sku-code" type="text" value="' + p.code + '" placeholder="SKU编码" style="width:80px;">' +
    '<input class="sku-weight" type="number" value="' + p.weight + '" placeholder="重量g" style="width:70px;">' +
    '<input class="sku-length" type="number" value="' + p.length + '" placeholder="长cm" style="width:60px;">' +
    '<input class="sku-width" type="number" value="' + p.width + '" placeholder="宽cm" style="width:60px;">' +
    '<input class="sku-height" type="number" value="' + p.height + '" placeholder="高cm" style="width:60px;">' +
    '<input class="sku-cost" type="number" value="' + p.cost + '" placeholder="成本CNY" style="width:70px;">' +
    '<input class="sku-qty" type="number" value="' + p.qty + '" placeholder="数量" style="width:50px;">' +
    '<select class="sku-goods">' +
      '<option value="pu"' + (p.goodsType==='pu'?' selected':'') + '>普货</option>' +
      '<option value="fei"' + (p.goodsType==='fei'?' selected':'') + '>带电</option>' +
      '<option value="pu_large"' + (p.goodsType==='pu_large'?' selected':'') + '>超2kg-普货</option>' +
      '<option value="fei_large"' + (p.goodsType==='fei_large'?' selected':'') + '>超2kg-带电</option>' +
    '</select>' +
    '<button onclick="removeSku(\'' + id + '\')" style="background:#ef4444;padding:5px 10px;">删</button>';
  document.getElementById('skuList').appendChild(row);
}

function removeSku(id) { document.getElementById(id).remove(); }

function getSkuList() {
  var rows = document.querySelectorAll('.sku-row');
  var list = [];
  rows.forEach(function(r) {
    list.push({
      code: r.querySelector('.sku-code').value || 'SKU',
      weight: parseFloat(r.querySelector('.sku-weight').value) || 0,
      length: parseFloat(r.querySelector('.sku-length').value) || 0,
      width: parseFloat(r.querySelector('.sku-width').value) || 0,
      height: parseFloat(r.querySelector('.sku-height').value) || 0,
      cost: parseFloat(r.querySelector('.sku-cost').value) || 0,
      qty: parseFloat(r.querySelector('.sku-qty').value) || 1,
      goodsType: r.querySelector('.sku-goods').value || 'pu'
    });
  });
  return list;
}

function getGlobalInputs() {
  return {
    rate: parseFloat(document.getElementById('rate').value) || 6.7,
    commission: (parseFloat(document.getElementById('commission').value) || 0) / 100,
    profit: (parseFloat(document.getElementById('profit').value) || 0) / 100,
    taxRate: (parseFloat(document.getElementById('taxRate').value) || 0) / 100,
    warehouseFee: parseFloat(document.getElementById('warehouseFee').value) || 0,
    discountRate: (parseFloat(document.getElementById('discountRate').value) || 0) / 100,
    divisor: parseFloat(document.getElementById('divisor').value) || 8000,
    useVolumetric: document.getElementById('useVolumetric').checked
  };
}

function calcBillingWeight(sku, g) {
  if (!g.useVolumetric) return sku.weight;
  var volG = (sku.length * sku.width * sku.height) / g.divisor * 1000;
  return Math.max(sku.weight, volG);
}

function findTier(tiers, g) {
  if (!tiers || !tiers.length) return null;
  for (var i = 0; i < tiers.length; i++) {
    var t = tiers[i];
    if (g > t.minG && g <= t.maxG) return t;
    if (t.minG === 0 && g <= t.maxG) return t;
  }
  return null;
}

function calcLogistics(country, sku, g, goodsType) {
  var billingG = calcBillingWeight(sku, g);
  var isLarge = (sku.weight > 2000 || sku.length > 60 || sku.width > 60 || sku.height > 60 || billingG > 2000);
  if (goodsType === 'pu_large' || goodsType === 'fei_large') isLarge = true;
  if (isLarge) {
    var tiers = country.large;
    if (!tiers || !tiers.length) return {fee:null, type:'大包暂无'};
    var tier = findTier(tiers, billingG);
    if (!tier) return {fee:null, type:'超大包范围'};
    if (billingG <= tier.firstG) return {fee: tier.firstFee, type:'大包'};
    var extra = billingG - tier.firstG;
    var steps = Math.ceil(extra / tier.stepG);
    return {fee: tier.firstFee + steps * tier.stepFee, type:'大包'};
  } else {
    var segs = goodsType === 'pu' || goodsType === 'pu_large' ? country.small.pu : country.small.fei;
    if (!segs || !segs.length) return {fee:null, type:'暂无'};
    var tier = findTier(segs, billingG);
    if (!tier) return {fee:null, type:'超小包范围'};
    return {fee: (billingG/1000) * tier.p + tier.r, type:'小包'};
  }
}

function calcSalePrice(cost, fee, warehouseFee, commission, profit, rate) {
  if (fee === null) return null;
  var denom = 1 - commission - profit;
  if (denom <= 0) return null;
  return (cost + fee + warehouseFee) / denom / rate;
}

function calculateAll() {
  var g = getGlobalInputs();
  var skus = getSkuList();
  var resultsDiv = document.getElementById('results');
  resultsDiv.innerHTML = '';
  lastResults = [];

  skus.forEach(function(sku) {
    var rows = [];
    RATES.forEach(function(c) {
      var log = calcLogistics(c, sku, g, sku.goodsType);
      var saleUsd = calcSalePrice(sku.cost, log.fee, g.warehouseFee, g.commission, g.profit, g.rate);
      var listUsd = saleUsd === null ? '暂无' : (g.discountRate > 0 ? (saleUsd / (1 - g.discountRate)).toFixed(2) : saleUsd.toFixed(2));
      var row = {
        sku: sku.code, name: c.name, code: c.code,
        fee: log.fee === null ? '暂无' : log.fee.toFixed(2),
        saleUsd: saleUsd === null ? '暂无' : saleUsd.toFixed(2),
        listUsd: listUsd,
        type: log.type
      };
      rows.push(row);
      lastResults.push(row);
    });

    var title = document.createElement('div');
    title.innerHTML = '<h3>SKU：' + sku.code + ' <button onclick="copySkuPrices(\'' + sku.code + '\')" style="background:#10b981;padding:4px 10px;font-size:12px;">复制整行(售价)</button></h3>';
    resultsDiv.appendChild(title);

    var half = Math.ceil(rows.length / 2);
    renderTable(rows.slice(0, half), resultsDiv, '第一行');
    renderTable(rows.slice(half), resultsDiv, '第二行');
  });
}

function renderTable(rows, container, label) {
  if (!rows.length) return;
  var div = document.createElement('div');
  div.innerHTML = '<div style="font-size:12px;color:#aaa;margin:10px 0 5px;">' + label + '</div>';
  var table = document.createElement('table');
  var thead = '<thead><tr><th>项目</th>';
  rows.forEach(function(r) { thead += '<th>' + r.name + ' <button class="btn-col" onclick="copySingleColumn(\'' + r.code + '\')">列</button></th>'; });
  thead += '</tr></thead>';
  var tbody = '<tbody>';
  tbody += '<tr><td>运费</td>' + rows.map(function(r) { return '<td>' + fmtFee(r.fee) + '</td>'; }).join('') + '</tr>';
  tbody += '<tr><td>标价(USD)</td>' + rows.map(function(r) { return '<td>' + fmtUsd(r.listUsd) + '</td>'; }).join('') + '</tr>';
  tbody += '</tbody>';
  table.innerHTML = thead + tbody;
  div.appendChild(table);
  container.appendChild(div);
}

function copyText(text, msg) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function() { showToast(msg); }).catch(function() { fallbackCopy(text, msg); });
  } else { fallbackCopy(text, msg); }
}

function fallbackCopy(text, msg) {
  var ta = document.createElement('textarea');
  ta.value = text; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); showToast(msg); } catch(e) { showToast('复制失败'); }
  document.body.removeChild(ta);
}

function copySkuPrices(skuCode) {
  var rows = lastResults.filter(function(r) { return r.sku === skuCode; });
  var prices = rows.map(function(r) { return r.listUsd; }).filter(function(v) { return v !== '暂无'; });
  copyText(prices.join('\t'), '已复制 ' + prices.length + ' 个国家的标价');
}

function copySingleColumn(countryCode) {
  var rows = lastResults.filter(function(r) { return r.code === countryCode; });
  var prices = rows.map(function(r) { return r.listUsd; }).filter(function(v) { return v !== '暂无'; });
  copyText(prices.join('\n'), '已复制 ' + prices.length + ' 个SKU的标价');
}

function copyMultiSku() {
  if (!lastResults.length) { showToast('请先计算'); return; }
  var skus = getSkuList();
  if (skus.length < 2) { showToast('请至少添加2个SKU'); return; }
  var skuCodes = skus.map(function(s) { return s.code; });
  var lines = [];
  RATES.forEach(function(c) {
    var rowData = [];
    skuCodes.forEach(function(skuCode) {
      var found = lastResults.find(function(r) { return r.sku === skuCode && r.code === c.code; });
      rowData.push(found && found.listUsd !== '暂无' ? found.listUsd : '');
    });
    lines.push(rowData.join('\t'));
  });
  copyText(lines.join('\n'), '已合并复制 ' + RATES.length + ' 个国家 × ' + skuCodes.length + ' 个SKU');
}

function exportCSV() {
  if (!lastResults.length) { alert('请先计算'); return; }
  var lines = [['SKU','国家','Code','运费','标价(USD)','类型'].join(',')];
  lastResults.forEach(function(r) {
    lines.push([r.sku, r.name, r.code, r.fee, r.listUsd, r.type].join(','));
  });
  var blob = new Blob(['\ufeff' + lines.join('\n')], {type: 'text/csv;charset=utf-8;'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'SKU区域定价.csv'; a.click();
}
</script>
</body>
</html>
